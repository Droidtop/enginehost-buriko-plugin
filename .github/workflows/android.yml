name: Android plugin

on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:

# Read-only unless a job below says otherwise; only the publishing jobs,
# which run no build code, get write on contents
# (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Builds the wrapper library and packs the bundle payload. No signing key
    # and no write token here: Gradle, its plugins, the SDL clone and the
    # third-party actions below run in this job
    # (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # 2026-09-16: setup-android's default package list still asks for the
      # obsolete "tools" SDK package, which Google has withdrawn from the
      # repository, so sdkmanager exits 1 and the job dies before Gradle runs.
      # The runner image already ships platform-tools and the command-line
      # tools; an empty list makes the action only put them on PATH.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Restore SDL sources
        # The engine's threads, atomics and surfaces; linked in statically
        # (app/src/main/cpp/CMakeLists.txt). No SDL Java: the engine runs in
        # Enginehost's sandbox and owns no Activity.
        run: git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git app/src/main/cpp/vendor/SDL
      - name: Build the wrapper library
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Pack the bundle inputs
        run: |
          set -euo pipefail
          aar=app/build/outputs/aar/app-release.aar
          mkdir -p build/unsigned/payload
          unzip -p "$aar" classes.jar > build/classes.jar
          "$ANDROID_HOME/build-tools/36.0.0/d8" --release --min-api 26 --output build/unsigned/payload build/classes.jar
          # Every ABI the wrapper build produced; Enginehost hands the isolated
          # runtime lib/<abi> for the device's own ABI.
          for abi in $(unzip -Z1 "$aar" 'jni/*/*.so' | cut -d/ -f2 | sort -u); do
            mkdir -p "build/unsigned/payload/lib/$abi"
            unzip -j "$aar" "jni/$abi/*.so" -d "build/unsigned/payload/lib/$abi"
          done
          # Both ABIs are the rule, not a preference: a bundle that lost one
          # would install and then fail to load on half the devices. One
          # library each: the engine, SDL and the file layer are all in it.
          test -f build/unsigned/payload/lib/arm64-v8a/libmain.so
          test -f build/unsigned/payload/lib/x86_64/libmain.so
          test "$(ls build/unsigned/payload/lib/arm64-v8a | wc -l)" -eq 1
          # The isolated runtime binds the plugin's natives and the file layer
          # through these two entry points.
          nm=$(find "$ANDROID_HOME/ndk" -name llvm-nm -path '*linux-x86_64*' | head -1)
          for abi in arm64-v8a x86_64; do
            symbols=$("$nm" -D --defined-only "build/unsigned/payload/lib/$abi/libmain.so")
            grep -q ' enginehost_register_natives$' <<<"$symbols"
            grep -q ' enginehost_vfs_bind$' <<<"$symbols"
          done
          cp enginehost/bundle-metadata.json build/unsigned/bundle-metadata.json
          cp enginehost/LICENSES.md build/unsigned/payload/LICENSES.md
          cp LICENSE build/unsigned/payload/LICENSE-GPL-2.0.txt
          cp app/src/main/cpp/vendor/SDL/LICENSE.txt build/unsigned/payload/LICENSE-SDL-zlib.txt
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/heads/plugin/')
        with:
          name: enginehost-buriko-openbgi-debug-apk-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build. Only plugin/** branches make a bundle.
    needs: android
    if: startsWith(github.ref, 'refs/heads/plugin/')
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      unsigned-artifact: enginehost-buriko-openbgi-debug-apk-unsigned
      bundle: dev.enginehost.buriko.openbgi.v1.enginehost.tar.xz
      artifact-name: enginehost-buriko-openbgi-debug-apk
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/heads/plugin/') }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-buriko-openbgi-debug-apk
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/plugin/') }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-buriko-openbgi-debug-apk
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
