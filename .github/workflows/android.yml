name: Android plugin

on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:

# Read-only unless a job below says otherwise; only the publishing jobs,
# which run no build code, get write on contents
# (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Builds the APK and packs the bundle payload. No signing key and no write
    # token here: Gradle, its plugins, the SDL clone and the third-party
    # actions below run in this job
    # (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # 2026-09-16: setup-android's default package list still asks for the
      # obsolete "tools" SDK package, which Google has withdrawn from the
      # repository, so sdkmanager exits 1 and the job dies before Gradle runs.
      # The runner image already ships platform-tools and the command-line
      # tools; an empty list makes the action only put them on PATH.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Restore SDL Android sources
        run: |
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git app/src/main/cpp/vendor/SDL
          mkdir -p app/src/main/java/org/libsdl/app
          cp app/src/main/cpp/vendor/SDL/android-project/app/src/main/java/org/libsdl/app/*.java app/src/main/java/org/libsdl/app/
      - name: Build plugin APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify plugin APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q dev.enginehost.plugin.RUN
          # Both ABIs are the rule, not a preference: the payload step copies
          # lib/ wholesale out of this APK, so a missing ABI here is a bundle
          # that installs and then fails to load on half the devices.
          unzip -l "$APK" | grep -q lib/arm64-v8a/libmain.so
          unzip -l "$APK" | grep -q lib/x86_64/libmain.so
      - name: Pack the unsigned bundle inputs
        if: startsWith(github.ref, 'refs/heads/plugin/')
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          mkdir -p build/unsigned/payload
          cp "$apk" build/unsigned/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/unsigned/payload
          cp enginehost/bundle-metadata.json build/unsigned/bundle-metadata.json
          # The wrapper APK is multidex. enginehost class-loads exactly the
          # dex files this metadata declares, so a hard-coded single-entry
          # list silently drops the rest of the wrapper at launch. Declare
          # what the payload actually contains, in load order.
          python3 - <<'DEXES'
          import json, pathlib, re
          payload = pathlib.Path('build/unsigned/payload')
          def order(p):
              # classes.dex, classes2.dex ... classes10.dex is numeric order;
              # a lexical sort would put 10 ahead of 2.
              m = re.fullmatch(r'classes(\d*)\.dex', p.name)
              return int(m.group(1) or 1)
          dexes = sorted(payload.glob('classes*.dex'), key=order)
          assert dexes, 'no classes*.dex in the APK payload'
          meta = pathlib.Path('build/unsigned/bundle-metadata.json')
          data = json.loads(meta.read_text())
          data['dexFiles'] = [d.name for d in dexes]
          meta.write_text(json.dumps(data, indent=2) + '\n')
          print('dexFiles =', data['dexFiles'])
          DEXES
          cp enginehost/LICENSES.md build/unsigned/payload/LICENSES.md
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/heads/plugin/')
        with:
          name: enginehost-buriko-openbgi-debug-apk-unsigned
          path: build/unsigned.tar
          if-no-files-found: error
      # The plain debug APK, for looking at by hand; the signed bundle is the
      # sign job's enginehost-buriko-openbgi-debug-apk artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-buriko-openbgi-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build. Only plugin/** branches make a bundle.
    needs: android
    if: startsWith(github.ref, 'refs/heads/plugin/')
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@4b9e41cb231b293d08852890aef54b619d4d57ec
    with:
      tooling-sha: 4b9e41cb231b293d08852890aef54b619d4d57ec
      unsigned-artifact: enginehost-buriko-openbgi-debug-apk-unsigned
      bundle: dev.enginehost.buriko.openbgi.v1.enginehost.tar.xz
      artifact-name: enginehost-buriko-openbgi-debug-apk
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one.
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/heads/plugin/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enginehost-buriko-openbgi-debug-apk
          path: release
      - name: Publish the signed bundle on the chosen channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # No artifact at all (a branch whose build makes no bundle) means no
          # release directory either; that is "nothing to publish", not an error.
          mkdir -p release
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          if [ -z "$bundle" ]; then
            echo "This branch's build produced no signed bundle; nothing to publish."
            exit 0
          fi
          id="$(basename "$bundle" .enginehost.tar.xz)"
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          test -f "$envelope"
          # The envelope names its channel; the app filters on it. The signed
          # manifest inside is untouched.
          python3 - "$envelope" "$CHANNEL" <<'PY'
          import json, sys
          path, channel = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["channel"] = channel
          json.dump(data, open(path, "w"), indent=2)
          PY
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          case "$CHANNEL" in
            stable) prerelease="" ;;
            testing) [[ "$tag" == *-testing ]] || tag="$tag-testing"; prerelease="--prerelease" ;;
            unstable) [[ "$tag" == *-unstable ]] || tag="$tag-unstable"; prerelease="--prerelease" ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          notes="Signed Enginehost bundle \`$id\` on the **$CHANNEL** channel, built from \`$REF_NAME\` at \`$SHA\` (build $RUN_NUMBER). Install it through Enginehost rather than unpacking it by hand: the bundle is verified file by file at install time against the key pinned for this repository."
          if [ "$CHANNEL" = unstable ] || [ "$CHANNEL" = testing ]; then
            # Rolling: the newest green build of the line is the whole release.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          fi

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it. Branches whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/plugin/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enginehost-buriko-openbgi-debug-apk
          path: release
      - name: Publish the signed bundle on the unstable channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          CHANNEL: unstable
          REQUESTED_TAG: ""
        run: |
          set -euo pipefail
          # No artifact at all (a branch whose build makes no bundle) means no
          # release directory either; that is "nothing to publish", not an error.
          mkdir -p release
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          if [ -z "$bundle" ]; then
            echo "This branch's build produced no signed bundle; nothing to publish."
            exit 0
          fi
          id="$(basename "$bundle" .enginehost.tar.xz)"
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          test -f "$envelope"
          # The envelope names its channel; the app filters on it. The signed
          # manifest inside is untouched.
          python3 - "$envelope" "$CHANNEL" <<'PY'
          import json, sys
          path, channel = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["channel"] = channel
          json.dump(data, open(path, "w"), indent=2)
          PY
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          case "$CHANNEL" in
            stable) prerelease="" ;;
            testing) [[ "$tag" == *-testing ]] || tag="$tag-testing"; prerelease="--prerelease" ;;
            unstable) [[ "$tag" == *-unstable ]] || tag="$tag-unstable"; prerelease="--prerelease" ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          notes="Signed Enginehost bundle \`$id\` on the **$CHANNEL** channel, built from \`$REF_NAME\` at \`$SHA\` (build $RUN_NUMBER). Install it through Enginehost rather than unpacking it by hand: the bundle is verified file by file at install time against the key pinned for this repository."
          if [ "$CHANNEL" = unstable ]; then
            # Rolling: the newest green build of the line is the whole release.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id (unstable)" $prerelease --notes "$notes"
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          fi
