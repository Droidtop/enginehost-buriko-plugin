name: Android plugin

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release. Only for a bundle proven to
          launch a real game on hardware -- a green build is not evidence of
          that, and a bundle that installs and then dies is worse for a user
          than one never offered.
        type: boolean
        default: false
      tag:
        description: "Release tag (default: derived from the bundle id)"
        type: string
        default: ""

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Droidtop/enginehost
          ref: codex/engine-bundles
          path: enginehost-tooling
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore SDL Android sources
        run: |
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git app/src/main/cpp/vendor/SDL
          mkdir -p app/src/main/java/org/libsdl/app
          cp app/src/main/cpp/vendor/SDL/android-project/app/src/main/java/org/libsdl/app/*.java app/src/main/java/org/libsdl/app/
      - name: Build plugin APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify plugin APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q dev.enginehost.plugin.RUN
          unzip -l "$APK" | grep -q lib/arm64-v8a/libmain.so
      - name: Build signed internal Enginehost bundle
        if: startsWith(github.ref, 'refs/heads/plugin/')
        env:
          ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}
        run: |
          test -n "$ENGINEHOST_SIGNING_KEY_PEM"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          mkdir -p build/payload build/output
          cp "$apk" build/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/payload
          cp enginehost/LICENSES.md build/payload/LICENSES.md
          printf '%s' "$ENGINEHOST_SIGNING_KEY_PEM" > build/signing-key.pem
          python3 enginehost-tooling/scripts/build-engine-bundle.py \
            --metadata enginehost/bundle-metadata.json --payload build/payload \
            --private-key build/signing-key.pem \
            --repository-key-document enginehost-public-key.json \
            --output build/output/dev.enginehost.buriko.openbgi.v1.enginehost.tar.xz \
            --release-envelope build/output/enginehost-release.json \
            --public-key-document build/output/enginehost-public-key.json
          cmp enginehost-public-key.json build/output/enginehost-public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-buriko-openbgi-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/output/*
          if-no-files-found: error

  publish:
    # Publishing is deliberate: it runs only from a manual dispatch that asks
    # for it, never on a push. Enginehost's catalog reads published releases,
    # so anything landing here is something a user will be offered.
    needs: android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          test -f "$bundle"
          id="$(basename "$bundle" .enginehost.tar.xz)"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" ${envelope:+"$envelope"} ${keydoc:+"$keydoc"}               --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$bundle" ${envelope:+"$envelope"} ${keydoc:+"$keydoc"}               --repo "${{ github.repository }}" --title "$id"               --notes "Signed Enginehost bundle \`$id\`, built from \`${{ github.ref_name }}\` at \`${{ github.sha }}\`. Install it through Enginehost rather than unpacking it by hand: the bundle is verified file by file at install time against the key pinned for this repository."
          fi
